<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanzApp | Iniciar sesion</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Tarjeta del formulario de inicio de sesion -->
  <main class="tarjeta-auth">
    <div class="tarjeta-auth__marca">FinanzApp</div>
    <h1>Inicia sesion</h1>
    <p class="tarjeta-auth__subtitulo">
      Bienvenido de nuevo, gestiona tus finanzas facilmente.
    </p>

    <!-- Alertas de error y de exito, ocultas por defecto -->
    <div id="alertaError" class="alerta alerta--error oculto" role="alert"></div>
    <div id="alertaExito" class="alerta alerta--exito oculto" role="status"></div>

    <form id="formLogin" novalidate>
      <div class="campo" id="campoEmail">
        <label for="email">Usuario (email):</label>
        <input type="email" id="email" name="email" autocomplete="email" />
        <div class="campo__mensaje-error"></div>
      </div>

      <div class="campo" id="campoPassword">
        <label for="password">Contrasena:</label>
        <input type="password" id="password" name="password" autocomplete="current-password" />
        <div class="campo__mensaje-error"></div>
      </div>

      <button type="submit" class="boton">Iniciar Sesion &rarr;</button>
    </form>

    <p class="enlace-auxiliar">
      ¿No tiene una cuenta? <a href="registro.html">Registrese</a>
    </p>
    <p class="enlace-auxiliar">
      <a href="recuperar.html" id="enlaceOlvidoPassword">Olvido la contrasena</a>
    </p>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
