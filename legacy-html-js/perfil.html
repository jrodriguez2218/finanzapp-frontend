<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanzApp | Mi perfil</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Formulario para que el usuario en sesion edite sus propios datos -->
  <main class="tarjeta-auth" style="max-width: 460px;">
    <div class="tarjeta-auth__marca">FinanzApp</div>
    <h1>Mi perfil</h1>
    <p class="tarjeta-auth__subtitulo">
      Actualiza tus datos personales. Deja la contrasena en blanco si no
      quieres cambiarla.
    </p>

    <div id="alertaError" class="alerta alerta--error oculto" role="alert"></div>
    <div id="alertaExito" class="alerta alerta--exito oculto" role="status"></div>

    <form id="formPerfil" novalidate>
      <div class="campo" id="campoNombres">
        <label for="nombres">Nombres</label>
        <input type="text" id="nombres" name="nombres" />
        <div class="campo__mensaje-error"></div>
      </div>

      <div class="campo" id="campoApellidos">
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos" />
        <div class="campo__mensaje-error"></div>
      </div>

      <div class="campo" id="campoCedula">
        <label for="cedula">Cedula</label>
        <input type="text" id="cedula" name="cedula" inputmode="numeric" />
        <div class="campo__mensaje-error"></div>
      </div>

      <div class="campo" id="campoFechaNacimiento">
        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento" />
        <div class="campo__mensaje-error"></div>
      </div>

      <div class="campo" id="campoEmail">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" />
        <div class="campo__mensaje-error"></div>
      </div>

      <div class="campo" id="campoPasswordNueva">
        <label for="passwordNueva">Nueva contrasena (opcional)</label>
        <input type="password" id="passwordNueva" name="passwordNueva" autocomplete="new-password" />
        <div class="campo__mensaje-error"></div>
      </div>

      <button type="submit" class="boton">Guardar cambios</button>
    </form>

    <p class="enlace-auxiliar">
      <a href="#" id="enlaceVolver">&larr; Volver</a>
    </p>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
